<div class="mb-3">
    @if (label) {
<label class="mb-1 mt-3" [attr.for]="controlId">
      {{ label }}
      @if (required) {
<span class="text-danger">*</span>
}
    </label>
}
    <textarea
      [id]="controlId"
      class="form-control"
      [attr.aria-invalid]="errorMessage ? true : null"
      [attr.aria-describedby]="errorMessage ? controlId + '-error' : null"
      [disabled]="disabled"
      [placeholder]="placeholder"
      [rows]="rows"
      (input)="onInput($event)"
      (blur)="onBlur()"
    >{{ value }}</textarea>
  
    <!-- dedicated area for errors -->
    @if (errorMessage) {
<div class="invalid-feedback d-block" [id]="controlId + '-error'">
      {{ errorMessage }}
    </div>
}
  </div>
